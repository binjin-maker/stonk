<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seismo — market event radar</title>
<link rel="icon" href="icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0a0d12;--p1:#11161e;--p2:#171e29;--p3:#1f2836;--ln:#263142;--tx:#dbe4ef;--mu:#7d8ba0;--up:#22c55e;--upb:#0f2d1b;--dn:#ef4444;--dnb:#331416;--ac:#f5b942;--bl:#5aa9ff;--pu:#b48cff;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
a{color:var(--bl);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--p3);color:var(--tx);border-radius:7px;padding:6px 12px}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
button.sm{padding:3px 8px;font-size:12px}button.armed{background:var(--dn)!important;color:#fff!important;border-color:var(--dn)!important}button.dng:hover{border-color:var(--dn);color:var(--dn)}
input,select{font:inherit;background:var(--p1);border:1px solid var(--ln);color:var(--tx);border-radius:7px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--p1);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px;display:flex;align-items:center;gap:8px}
.logo svg{display:block}
.pill{font:600 11px var(--mono);padding:3px 8px;border-radius:99px;background:var(--p3);color:var(--mu);white-space:nowrap}
.pill.g{background:var(--upb);color:var(--up)}.pill.r{background:var(--dnb);color:var(--dn)}.pill.y{background:#33280f;color:var(--ac)}
.grow{flex:1}.mu{color:var(--mu)}.mono{font-family:var(--mono)}.up{color:var(--up)}.dn{color:var(--dn)}.small{font-size:12px}
#tape{display:flex;gap:0;overflow-x:auto;background:#0d1118;border-bottom:1px solid var(--ln);scrollbar-width:none}
.tk{padding:6px 14px;border-right:1px solid var(--ln);white-space:nowrap;font:12px var(--mono);display:flex;gap:8px;align-items:center}
.tk b{color:var(--mu);font-weight:600}
nav{display:flex;gap:2px;padding:0 14px;background:var(--p1);border-bottom:1px solid var(--ln);overflow-x:auto}
nav a{padding:10px 14px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600}
nav a.on{color:var(--tx);border-color:var(--ac)}nav a:hover{text-decoration:none;color:var(--tx)}
nav .badge{background:var(--dn);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:4px}
main{padding:18px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(620px,100%),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;overflow-x:auto;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu)}
.big{font:700 28px var(--mono)}
.kv{display:flex;gap:22px;flex-wrap:wrap}.kv div{display:flex;flex-direction:column}.kv span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}.kv b{font:600 17px var(--mono)}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--p1)}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--p2)}td.num{font-family:var(--mono);text-align:right}th.num{text-align:right}
.ol{font:700 11px var(--mono);padding:2px 7px;border-radius:5px;display:inline-block}
.l2{background:var(--up);color:#04170b}.l1{background:var(--upb);color:var(--up)}.l0{background:var(--p3);color:var(--mu)}.l-1{background:var(--dnb);color:var(--dn)}.l-2{background:var(--dn);color:#fff}
.cls{font:700 10px var(--mono);padding:2px 6px;border-radius:4px;letter-spacing:.4px}
.c-TEMPORARY{background:#13283f;color:var(--bl)}.c-WELL-KNOWN{background:#2a2140;color:var(--pu)}.c-PERMANENT{background:#3a2a0c;color:var(--ac)}.c-PRICE{background:var(--p3);color:var(--mu)}
.fl1{color:var(--ac)}.fl2{color:#ff8a3d;font-weight:700}.fl3{color:var(--dn);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:600 11px var(--mono);padding:3px 7px;border-radius:5px;background:var(--p3);color:var(--mu);border:1px solid transparent;white-space:nowrap}
.chip.v-UP{background:var(--upb);color:var(--up)}.chip.v-LEAN-UP{color:var(--up);border-color:#1d4d30}.chip.v-DOWN{background:var(--dnb);color:var(--dn)}.chip.v-LEAN-DOWN{color:var(--dn);border-color:#5a2226}
.chip.cons{border-color:var(--ac)}
.ev{border:1px solid var(--ln);border-left:4px solid var(--mu);border-radius:10px;padding:11px 13px;background:var(--p1);margin-bottom:10px}
.ev.d1{border-left-color:var(--up)}.ev.d-1{border-left-color:var(--dn)}
.ev .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .eff{color:#b7c2d1;margin:6px 0 4px;font-size:13px}
.ev ul{margin:6px 0 0;padding-left:18px;font-size:12.5px}.ev li{margin:2px 0}
.note{font-size:12px;color:var(--pu);margin-top:3px}
.hold{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--ln);background:var(--p1);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.hold .tt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.hold .tt b{font:800 18px var(--mono)}
.fc{font-size:13px;color:#c3cddb;margin-top:8px;max-width:1000px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.form label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:3px;text-transform:uppercase;letter-spacing:.4px}
.ac{position:relative}.acl{position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--p2);border:1px solid var(--ln);border-radius:8px;max-height:320px;overflow:auto;min-width:340px}
.acl div{padding:7px 10px;cursor:pointer;display:flex;gap:8px}.acl div:hover{background:var(--p3)}
.hit{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--ln);border-radius:9px;margin-bottom:6px;background:var(--p1);cursor:pointer}
.hit:hover{border-color:var(--ac)}
#modal{position:fixed;inset:0;background:#000a;z-index:50;display:none;overflow:auto;padding:30px 14px}
#modal .box{max-width:1100px;margin:0 auto;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:20px}
.x{float:right}
canvas{width:100%;display:block}
.bar{height:8px;border-radius:4px;background:var(--p3);position:relative;overflow:hidden}.bar i{position:absolute;top:0;bottom:0}
.sect{display:grid;grid-template-columns:110px 1fr 60px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.th{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:var(--p1);margin-bottom:8px}
.th .n{font-weight:700}.th.off{opacity:.5}
.alert{display:flex;gap:10px;padding:9px 12px;border-radius:9px;border:1px solid var(--ln);background:var(--p1);margin-bottom:7px;cursor:pointer}
.alert.bad{border-left:4px solid var(--dn)}.alert.good{border-left:4px solid var(--up)}
.empty{color:var(--mu);padding:20px;text-align:center}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--ac);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
footer{color:var(--mu);font-size:11px;text-align:center;padding:20px}
.toggle{display:flex;gap:8px;align-items:center;cursor:pointer}.form label.toggle{flex-direction:row;font-size:14px;text-transform:none;letter-spacing:0;color:var(--tx)}
.wrong{font-size:11px;color:var(--mu);cursor:pointer;border:1px solid var(--ln);border-radius:5px;padding:1px 7px;background:none}
.wrong:hover{color:var(--ac);border-color:var(--ac)}
.wx{color:var(--mu);cursor:pointer;margin-left:6px;font-size:11px;opacity:.55}.wx:hover{color:var(--dn);opacity:1}
.wmenu{margin-top:8px;padding:10px;border:1px dashed var(--ac);border-radius:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--p2)}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:7px;overflow:hidden;margin-right:6px}.seg b{padding:4px 10px;font:600 12px var(--mono);cursor:pointer;color:var(--mu)}.seg b.on{background:var(--ac);color:#111}.seg b:hover:not(.on){color:var(--tx)}
.ckey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:#c3cddb;padding:8px 4px 2px}.ckey span{display:inline-flex;align-items:center;gap:6px}
.ckey.ev{border-top:1px solid var(--ln);margin-top:6px;padding-top:8px}.ckey .num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:#0b0f15;font:700 11px var(--mono)}
#toast{position:fixed;bottom:18px;right:18px;background:var(--p2);border:1px solid var(--ac);padding:10px 14px;border-radius:9px;display:none;z-index:60}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"><svg width="26" height="20" viewBox="0 0 26 20"><polyline points="0,10 5,10 8,3 11,17 14,6 17,13 19,10 26,10" fill="none" stroke="#f5b942" stroke-width="2.2" stroke-linejoin="round"/></svg>SEISMO</div>
  <span id="mstat" class="pill">—</span>
  <span id="regime" class="pill">—</span>
  <span id="scan" class="mu small"></span>
  <div class="grow"></div>
  <span id="counts" class="mu small mono"></span>
  <button id="scanBtn" class="sm">Scan now</button>
</header>
<div id="tape"></div>
<nav id="nav"></nav>
<main id="main"></main>
<footer>Seismo reads public news and price data and runs it through rule-based models. Its forecasts are estimates, not financial advice.</footer>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let S=null,tab=localStorage.getItem('tab')||'dash',sortK={sig:['Expected',1]},evF={cls:'',dir:'',mine:false,q:''},sigF={q:'',sector:'',ol:''},lastAlertTop=null;
const TABS=[['dash','Dashboard'],['port','My Portfolio'],['find','Find & Track'],['signals','All Signals'],['events','Events'],['world','World'],['theories','Theories'],['alerts','Alerts'],['sources','Sources'],['settings','Settings']];
const TSHORT={news:'NEWS',box:'BOX THEORY',dow:'DOW THEORY',ma:'GOLDEN CROSS',rsi:'RSI',macd:'MACD',boll:'BOLLINGER',meanrev:'MEAN REVERSION',mom:'MOMENTUM',fib:'FIBONACCI',obv:'VOLUME/OBV',contra:'CONTRARIAN',candles:'CANDLES',emh:'EFFICIENT MKT'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(x,d=1)=>(x>=0?'+':'')+(+x).toFixed(d)+'%';
const cpct=(x,d=1)=>`<span class="${x>=0?'up':'dn'}">${pct(x,d)}</span>`;
const money=x=>{const n=Math.abs(x);return (x<0?'-':'')+'$'+n.toLocaleString(undefined,{minimumFractionDigits:n<1000?2:0,maximumFractionDigits:n<1000?2:0})};
const smoney=x=>`<span class="${x>=0?'up':'dn'}">${x>=0?'+':''}${money(x)}</span>`;
const price=x=>x>=1000?x.toLocaleString(undefined,{maximumFractionDigits:0}):x>=1?x.toFixed(2):x.toFixed(4);
const ago=t=>{const s=(Date.now()-new Date(t))/1000;if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago'};
const ol=(o,l)=>`<span class="ol l${l}">${esc(o)}</span>`;
const fl=(f,lbl)=>`<span class="fl${f}">${esc(lbl||['Low','Elevated','High','Severe'][f])}</span>`;
const cls=c=>c?`<span class="cls c-${c}">${c}</span>`:'';
function flash(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3000)}
async function api(p,body){const r=await fetch(p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!r.ok)throw new Error((await r.text())||r.status);return r.json()}

function enabledTheories(){return (S&&S.Settings.Theories&&S.Settings.Theories.length)?S.Settings.Theories:['news','box','dow']}
function consensus(ths){const en=enabledTheories();const t=(ths||[]).filter(x=>en.includes(x.ID));if(!t.length)return null;let s=0,u=0,d=0,n=0;for(const x of t){s+=x.Score;if(x.Score>=0.4)u++;else if(x.Score<=-0.4)d++;else n++}s/=t.length;const v=s>=1?'UP':s>=0.35?'LEAN UP':s<=-1?'DOWN':s<=-0.35?'LEAN DOWN':'NEUTRAL';return {v,u,d,n,s}}
function theoryChips(ths,withCons=true){const en=enabledTheories();const t=(ths||[]).filter(x=>en.includes(x.ID));if(!t.length)return '';const c=consensus(ths);let h='<div class="chips">';if(withCons&&c)h+=`<span class="chip cons v-${c.v.replace(' ','-')}" title="${c.u} up / ${c.d} down / ${c.n} neutral">CONSENSUS: ${c.v} (${c.u}↑ ${c.d}↓ ${c.n}–)</span>`;for(const x of t)h+=`<span class="chip v-${x.Verdict.replace(' ','-')}" title="${esc(x.Detail)}">${TSHORT[x.ID]||x.ID}: ${x.Verdict}</span>`;return h+'</div>'}

function spark(arr,w=120,h=30){if(!arr||arr.length<2)return '';const mn=Math.min(...arr),mx=Math.max(...arr),r=mx-mn||1;const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');const c=arr[arr.length-1]>=arr[0]?'#22c55e':'#ef4444';return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`}

function renderNav(){const nAl=(S?.Alerts||[]).filter(a=>new Date(a.At)>new Date(localStorage.getItem('alSeen')||0)).length;$('#nav').innerHTML=TABS.map(([k,n])=>`<a href="#" data-t="${k}" class="${tab===k?'on':''}">${n}${k==='alerts'&&nAl?`<span class="badge">${nAl}</span>`:''}</a>`).join('');$('#nav').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();setTab(a.dataset.t)})}
function setTab(t){tab=t;localStorage.setItem('tab',t);if(t==='alerts')localStorage.setItem('alSeen',new Date().toISOString());render()}

function renderTop(){
  const m=S.MarketStatus;$('#mstat').className='pill '+(m==='OPEN'?'g':m==='CLOSED'?'':'y');$('#mstat').textContent='NYSE '+m;
  const r=S.Regime;$('#regime').className='pill '+(r.includes('RISK-ON')?'g':r==='FEAR'||r==='RISK-OFF'?'r':'');$('#regime').textContent=r;$('#regime').title=S.RegimeNote;
  $('#logo').title='Seismo v'+S.Version;
  $('#scan').innerHTML=S.Scanning?`<span class="spin"></span> ${esc(S.ScanMsg)}`:`${esc(S.ScanMsg||'')}${S.NextScan&&new Date(S.NextScan)>new Date()?` · next scan ${new Date(S.NextScan).toLocaleString(undefined,{weekday:new Date(S.NextScan).toDateString()===new Date().toDateString()?undefined:'short',hour:'numeric',minute:'2-digit'})}`:''}`;
  const ok=(S.Sources||[]).filter(s=>s.OK).length;$('#counts').textContent=`${(S.NArticles||0).toLocaleString()} articles · ${ok}/${(S.Sources||[]).length} sources · ${S.NCompanies||0} cos`;
  $('#tape').innerHTML=(S.Market||[]).map(x=>`<div class="tk"><b>${esc(x.Name)}</b>${x.OK?`${price(x.Price)} ${cpct(x.DayPct,2)} ${spark(x.Spark,50,16)}`:'<span class="mu">—</span>'}</div>`).join('');
}

function sigRow(s){return `<tr class="cl" data-t="${s.Ticker}"><td><b class="mono">${esc(s.Ticker)}</b> <span class="mu small">${esc(s.Name)}</span>${s.Held?' <span class="pill y">HELD</span>':s.Watched?' <span class="pill">WATCH</span>':''}</td><td class="num">${s.HasQuote?price(s.Price):'—'}</td><td class="num">${s.HasQuote?cpct(s.DayPct,2):'—'}</td><td>${ol(s.Outlook,s.OutlookLvl)}</td><td class="num">${cpct(s.Expected)}</td><td class="num">${s.Confidence}%</td><td>${fl(s.Flight,s.FlightLabel)}</td><td class="small mu">${esc(s.Drivers?.[0]?.Label||'')}</td></tr>`}
const sigHead=`<tr><th>Company</th><th class="num">Price</th><th class="num">Day</th><th>Outlook</th><th class="num">Exp. move</th><th class="num">Conf.</th><th>Flight risk</th><th>Main driver</th></tr>`;

function evCard(c){
  const t=c.Kind==='macro';
  return `<div class="ev d${c.Dir}"><div class="hd">${t?'<span class="pill">WORLD</span>':`<a href="#" class="mono" data-co="${c.Ticker}"><b>${esc(c.Ticker)}</b></a> <span class="mu">${esc(c.Name)}</span>`}
  <b>${c.Dir>0?'▲':c.Dir<0?'▼':'◆'} ${esc(c.Label)}</b> ${cls(c.Class)} ${!t?`<span class="mono small">${cpct(c.Impact)}</span>`:''}
  ${c.Dir<0&&c.Flight>=2?`<span class="small">flight risk ${fl(c.Flight)}</span>`:''}<span class="grow"></span><span class="mu small">${c.NSources} sources · ${c.NArticles} articles · ${ago(c.LastSeen)}</span><button class="wrong" data-wrong="1" data-t="${esc(c.Ticker||'')}" data-e="${esc(c.EventID)}" data-k="${c.Kind}" data-l="${esc(c.Label)}" title="Tell Seismo it got this wrong">Wrong?</button></div>
  <div class="eff">${esc(c.Effect)}</div>${c.Note?`<div class="note">${esc(c.Note)}</div>`:''}
  ${t&&c.Sectors?`<div class="chips" style="margin-top:6px">${Object.entries(c.Sectors).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k,v])=>`<span class="chip v-${v>0?'UP':'DOWN'}">${k==='broad'?'Whole market':k} ${v>0?'+':''}${v}</span>`).join('')}</div>`:''}
  <ul>${(c.Articles||[]).slice(0,5).map(a=>`<li><a href="${esc(a.URL)}" target="_blank" rel="noopener">${esc(a.Title)}</a> <span class="mu">— ${esc(a.Source)}, ${ago(a.Published)}${a.Hedged?' · speculative':''}</span><span class="wx" data-wa="${esc(a.ID)}" data-t="${esc(c.Ticker||'')}" data-e="${esc(c.EventID)}" data-k="${c.Kind}" data-l="${esc(c.Label)}" title="This headline is misread">✕</span></li>`).join('')}</ul></div>`}

function dash(){
  const P=S.Portfolio,sig=S.Signals||[];
  const ups=sig.filter(s=>s.Expected>0).sort((a,b)=>b.Expected-a.Expected).slice(0,8),dns=sig.filter(s=>s.Expected<0).sort((a,b)=>a.Expected-b.Expected).slice(0,8);
  const perm=(S.Events||[]).filter(e=>e.Class==='PERMANENT'&&Math.abs(e.Impact)>=1).slice(0,6);
  const fr=sig.filter(s=>s.Flight>=2).slice(0,10);
  return `<div class="grid g2">
  <div class="card"><h3>My portfolio</h3>${P.Holdings?.length?`<div class="kv"><div><span>Value</span><b>${money(P.Value)}</b></div><div><span>Invested</span><b>${money(P.Invested)}</b></div><div><span>Total P/L</span><b>${smoney(P.PL)} ${cpct(P.PLPct)}</b></div><div><span>Today</span><b>${smoney(P.DayPL)}</b></div><div><span>Model outlook (≈2 wks)</span><b>${smoney(P.ExpUSD)} ${cpct(P.ExpPct)}</b></div></div>
   <table style="margin-top:10px">${P.Holdings.map(h=>`<tr class="cl" data-t="${h.Ticker}"><td><b class="mono">${h.Ticker}</b> <span class="mu small">${esc(h.Name)}</span></td><td class="num">${money(h.Value)}</td><td class="num">${cpct(h.PLPct)}</td><td>${ol(h.Outlook,h.OutlookLvl)}</td><td class="num">${smoney(h.ExpUSD)}</td><td>${fl(h.Flight,h.FlightLabel)}</td></tr>`).join('')}</table>`
   :`<div class="empty">No investments yet. <a href="#" onclick="setTab('port');return false">Add what you've invested</a> and Seismo will track it 24/7 and alert you to big events.</div>`}</div>
  <div class="card"><h3>Latest alerts</h3>${(S.Alerts||[]).slice(0,6).map(alertRow).join('')||'<div class="empty">No alerts yet. Big events on stocks you hold or track show up here and as Windows notifications.</div>'}</div>
  <div class="card"><h3>Predicted to go UP</h3><table>${sigHead}${ups.map(sigRow).join('')}</table></div>
  <div class="card"><h3>Predicted to go DOWN</h3><table>${sigHead}${dns.map(sigRow).join('')}</table></div>
  <div class="card"><h3>Permanent / structural events</h3>${perm.map(evCard).join('')||'<div class="empty">None right now.</div>'}</div>
  <div class="card"><h3>Investor-flight watch</h3>${fr.length?`<table>${sigHead}${fr.map(sigRow).join('')}</table>`:'<div class="empty">No company currently has high investor-flight risk.</div>'}

function render(){if(!S)return;renderNav();renderTop();const f={dash,port,find,signals,events,world,theories,alerts,sources,settings}[tab]||dash;

async function addHolding(){const b={Ticker:$('#hT').value.trim(),Invested:+$('#hI').value||0,Shares:+$('#hS').value||0,BuyPrice:+$('#hP').value||0};if(!b.Ticker){flash('Enter a company or ticker');return}

  $('#hAdd').disabled=true;try{await api('/api/holding',b);flash('Added '+b.Ticker.toUpperCase()+'. Tracking started.');['#hT','#hI','#hS','#hP'].forEach(s=>$(s).value='');await refresh()}catch(e){flash(e.message)}$('#hAdd').disabled=false}

function editHolding(t){const h=S.Portfolio.Holdings.find(x=>x.Ticker===t);const card=document.querySelector(`[data-edit="${t}"]`).closest('.hold');if(card.querySelector('.editf'))return;

let CH=null;
const smaS=(x,n)=>x.map((_,i)=>i<n-1?null:x.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n);

const emaS=(x,n)=>{const k=2/(n+1),o=[];x.forEach((v,i)=>o.push(i?v*k+o[i-1]*(1-k):v));return o};

function chartData(d){const c=d.Closes||[],n=c.length,h=d.Highs||c,l=d.Lows||c,v=d.Volumes||[],t=d.Times||[];
  const o={c,h,l,v,t,n};

  o.sw=[];const w=5;for(let i=Math.max(0,n-160)+w;i<n-w;i++){let H=true,L=true;for(let j=i-w;j<=i+w;j++){if(c[j]>c[i])H=false;if(c[j]<c[i])L=false}if(H)o.sw.push([i,'H']);if(L)o.sw.push([i,'L'])}
  const long=n>=205;o.maF=smaS(c,long?50:20);o.maS=smaS(c,long?200:50);o.maLbl=long?['50d','200d']:['20d','50d'];
  o.cross=[];for(let i=1;i<n;i++){if(o.maF[i-1]==null||o.maS[i-1]==null)continue;const a=o.maF[i-1]-o.maS[i-1],b=o.maF[i]-o.maS[i];if(a<=0&&b>0)o.cross.push([i,'G']);if(a>=0&&b<0)o.cross.push([i,'D'])}

function candleAtJS(o,h,l,c,i){
  if(i<3||i>=c.length)return [];
  const body=k=>Math.abs(c[k]-o[k]),rng=k=>Math.max(h[k]-l[k],1e-9),up=k=>c[k]>o[k],upper=k=>h[k]-Math.max(o[k],c[k]),lower=k=>Math.min(o[k],c[k])-l[k];
  let ab=0,cnt=0;for(let k=Math.max(0,i-10);k<i;k++){ab+=body(k);cnt++}ab/=cnt||1;
  const j=Math.max(0,i-6),trend=(c[i-1]-c[j])/c[j],b=body(i),r=rng(i),out=[];
  if(b<=0.1*r)out.push(['Doji (indecision)','D',0]);
  else if(lower(i)>=2*b&&upper(i)<=0.35*b+0.05*r&&trend<-0.01)out.push(['Hammer (bullish reversal)','H',1]);
  else if(upper(i)>=2*b&&lower(i)<=0.35*b+0.05*r&&trend>0.01)out.push(['Shooting star (bearish reversal)','SS',-1]);
  else if(lower(i)>=2*b&&upper(i)<=0.35*b+0.05*r&&trend>0.01)out.push(['Hanging man (bearish warning)','HM',-1]);
  else if(upper(i)>=2*b&&lower(i)<=0.35*b+0.05*r&&trend<-0.01)out.push(['Inverted hammer (bullish warning)','IH',1]);
  if(!up(i-1)&&up(i)&&o[i]<=c[i-1]&&c[i]>=o[i-1]&&b>body(i-1))out.push(['Bullish engulfing','BE',1]);
  if(up(i-1)&&!up(i)&&o[i]>=c[i-1]&&c[i]<=o[i-1]&&b>body(i-1))out.push(['Bearish engulfing','bE',-1]);
  if(!up(i-2)&&body(i-2)>ab&&body(i-1)<0.5*ab&&up(i)&&c[i]>(o[i-2]+c[i-2])/2)out.push(['Morning star (bullish reversal)','MS',1]);
  if(up(i-2)&&body(i-2)>ab&&body(i-1)<0.5*ab&&!up(i)&&c[i]<(o[i-2]+c[i-2])/2)out.push(['Evening star (bearish reversal)','ES',-1]);
  if(up(i)&&up(i-1)&&up(i-2)&&c[i]>c[i-1]&&c[i-1]>c[i-2]&&b>0.6*ab&&body(i-1)>0.6*ab&&body(i-2)>0.6*ab)out.push(['Three white soldiers','3W',1]);
  if(!up(i)&&!up(i-1)&&!up(i-2)&&c[i]<c[i-1]&&c[i-1]<c[i-2]&&b>0.6*ab&&body(i-1)>0.6*ab&&body(i-2)>0.6*ab)out.push(['Three black crows','3B',-1]);
  return out}

  if(on.has('news')&&fut){const col=sig.Expected>=0?'#22c55e':'#ef4444';g.fillStyle=sig.Expected>=0?'#22c55e24':'#ef444424';g.beginPath();g.moveTo(X(n-1),Y(last));g.lineTo(X(n-1+fut),Y(last*(1+sig.High/100)));g.lineTo(X(n-1+fut),Y(last*(1+sig.Low/100)));g.closePath();g.fill();g.strokeStyle=col;g.lineWidth=2;g.setLineDash([6,4]);g.beginPath();g.moveTo(X(n-1),Y(last));g.lineTo(X(n-1+fut),Y(last*(1+sig.Expected/100)));g.stroke();g.setLineDash([]);g.lineWidth=1;
    tag(X(n-1+fut)-120,Y(last*(1+sig.Expected/100))+(sig.Expected>=0?-16:16),`FORECAST ${pct(sig.Expected)}`,col);legend.push([col,'Seismo forecast cone','area'])}
  if(on.has('news')&&t.length===n){const marks=[];for(const e of events||[]){if(Math.abs(e.Impact)<0.3)continue;const ts=new Date(e.FirstSeen)/1000;let idx=n-1;for(let i=0;i<n;i++)if(t[i]>=ts-43200){idx=i;break}if(idx>=vs)marks.push([idx,e])}
    marks.sort((a,b)=>Math.abs(b[1].Impact)-Math.abs(a[1].Impact));const shown=marks.slice(0,8).sort((a,b)=>a[0]-b[0]);const stack={};
    shown.forEach(([i,e],k)=>{const num=k+1,s=stack[i]=(stack[i]||0)+1,up=e.Dir>0,col=up?'#22c55e':'#ef4444';let y=up?Y(h[i])-16-s*22:Y(l[i])+16+s*22;y=Math.max(top0+10,Math.min(pBot-10,y));for(let tries=0;tries<12&&hit({x:X(i)-10,y:y-10,w:20,h:20});tries++){y+=(up?-1:1)*(tries%2?-22*tries:22*tries);y=Math.max(top0+10,Math.min(pBot-10,y))}
      g.strokeStyle=col+'88';g.beginPath();g.moveTo(X(i),up?Y(h[i])-3:Y(l[i])+3);g.lineTo(X(i),y);g.stroke();g.fillStyle=col;g.beginPath();g.arc(X(i),y,9,0,7);g.fill();g.fillStyle='#0b0f15';g.font=`bold 11px ${F}`;g.textAlign='center';g.fillText(String(num),X(i),y+1);g.textAlign='left';g.font=`12px ${F}`;placed.push({x:X(i)-10,y:y-10,w:20,h:20});
      keyItems.push({num,col,label:e.Label,impact:e.Impact,cls:e.Class,date:t[i]})})}
  if(!candles){g.fillStyle=upc?'#22c55e':'#ef4444';g.beginPath();g.arc(X(n-1),Y(last),4,0,7);g.fill()}
  g.restore();
  g.font=`bold 11px ${F}`;const pl=price(last),pw=g.measureText(pl).width+10;g.fillStyle=c[n-1]>=op[n-1]?'#22c55e':'#ef4444';g.fillRect(2,Y(last)-9,pad-6,18);g.fillStyle='#0b0f15';g.textAlign='right';g.fillText(pl,pad-8,Y(last)+1);g.textAlign='left';g.font=`12px ${F}`;

  let top=MH;const sub=(name,arr,lo,hi,lines,extra)=>{top+=10;const y=v=>top+4+(1-(v-lo)/((hi-lo)||1))*(SH-8);g.strokeStyle='#263142';g.strokeRect(pad,top,W-pad-right,SH);g.fillStyle='#8b98ad';g.font=`bold 11px ${F}`;g.fillText(name,6,top+12);g.font=`11px ${F}`;
    (lines||[]).forEach(([v,col])=>{g.strokeStyle=col;g.setLineDash([3,3]);g.beginPath();g.moveTo(pad,y(v));g.lineTo(W-right,y(v));g.stroke();g.setLineDash([]);g.fillStyle=col;g.textAlign='right';g.fillText(String(v),pad-8,y(v));g.textAlign='left'});
    g.save();g.beginPath();g.rect(pad,top,W-pad-right,SH);g.clip();extra&&extra(y);if(arr){g.strokeStyle='#e5e7eb';g.lineWidth=1.3;g.beginPath();let st=false;for(let i=Math.max(0,vs-1);i<arr.length;i++){const v=arr[i];if(v==null)continue;st?g.lineTo(X(i),y(v)):g.moveTo(X(i),y(v));st=true}g.stroke();g.lineWidth=1}g.restore();top+=SH};
  for(const k of subs){
    if(k==='rsi')sub('RSI',o.rsi,0,100,[[70,'#ef4444'],[30,'#22c55e']],y=>{g.fillStyle='#ef444410';g.fillRect(pad,y(100),W-pad-right,y(70)-y(100));g.fillStyle='#22c55e10';g.fillRect(pad,y(30),W-pad-right,y(0)-y(30))});
    if(k==='macd'){const hist=o.macd.map((m,i)=>m-o.sig[i]),s0=Math.max(26,vs),all=[...o.macd.slice(s0),...o.sig.slice(s0),...hist.slice(s0)],a=Math.max(...all.map(Math.abs))||1;sub('MACD',null,-a,a,[[0,'#7d8ba0']],y=>{for(let i=s0;i<n;i++){const v=hist[i];g.fillStyle=v>=0?'#22c55e88':'#ef444488';const w=Math.max(1,slot*0.6);g.fillRect(X(i)-w/2,Math.min(y(0),y(v)),w,Math.abs(y(v)-y(0)))}const ln=(arr,col)=>{g.strokeStyle=col;g.beginPath();for(let i=s0;i<n;i++)i===s0?g.moveTo(X(i),y(arr[i])):g.lineTo(X(i),y(arr[i]));g.stroke()};ln(o.macd,'#5aa9ff');ln(o.sig,'#f5b942')})}
    if(k==='obv'){const seg=o.obv.slice(vs),lo=Math.min(...seg),hi=Math.max(...seg);sub('OBV',o.obv,lo,hi,[])}
  }
  CH={o,X,Y,pad,right,n,W,H,MH,fut,last,vs,slot};
  return {legend,keyItems};
}

function renderChartKey(el,res){
  const sw=(col,kind)=>kind==='none'?'':kind==='line'?`<i style="display:inline-block;width:18px;height:3px;background:${col};border-radius:2px"></i>`:kind==='dash'?`<i style="display:inline-block;width:18px;border-top:2px dashed ${col}"></i>`:kind==='dot'?`<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${col}"></i>`:`<i style="display:inline-block;width:14px;height:11px;background:${col}33;border:1px solid ${col}"></i>`;
  el.innerHTML=(res.legend.length?`<div class="ckey">${res.legend.map(([c,t,k])=>`<span>${sw(c,k)}${esc(t)}</span>`).join('')}</div>`:'')+
   (res.keyItems.length?`<div class="ckey ev">${res.keyItems.map(x=>`<span><b class="num" style="background:${x.col}">${x.num}</b>${esc(x.label)} <span class="mono ${x.impact>=0?'up':'dn'}">${pct(x.impact)}</span> <span class="mu">${new Date(x.date*1000).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></span>`).join('')}</div>`:'');
}

function chartHover(cv,tip){cv.onmousemove=e=>{if(!CH)return;const rc=cv.getBoundingClientRect(),x=e.clientX-rc.left;const i=Math.round((x-CH.pad-CH.slot*0.5)/CH.slot)+CH.vs;if(i<CH.vs||i>=CH.n){tip.style.display='none';return}
  const o=CH.o,dt=o.t[i]?new Date(o.t[i]*1000).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):'',ch=i>0?(o.c[i]/o.c[i-1]-1)*100:0,vv=o.v[i]?(o.v[i]>=1e6?(o.v[i]/1e6).toFixed(1)+'M':(o.v[i]/1e3).toFixed(0)+'K'):'';
  tip.style.display='block';tip.style.left=Math.min(x+14,rc.width-210)+'px';tip.style.top=(e.clientY-rc.top+10)+'px';
  tip.innerHTML=`<b>${dt}</b> <span class="${ch>=0?'up':'dn'}">${pct(ch,2)}</span><br>O ${price(o.op[i])} &nbsp;H ${price(o.h[i])}<br>L ${price(o.l[i])} &nbsp;C ${price(o.c[i])}${vv?`<br>Vol ${vv}`:''}${o.rsi[i]!=null?` · RSI ${o.rsi[i].toFixed(0)}`:''}${(o.pats&&o.pats[i]||[]).map(p=>`<br><span class="${p[2]>0?'up':p[2]<0?'dn':'mu'}">${p[1]}: ${esc(p[0])}</span>`).join('')}`};cv.onmouseleave=()=>tip.style.display='none'}

async function openCo(t){if(!t)return;location.hash='t='+t;$('#modal').style.display='block';$('#mbox').innerHTML='<span class="spin"></span> Loading '+esc(t)+'…';
  let d;try{d=await api('/api/company?t='+encodeURIComponent(t))}catch(e){$('#mbox').innerHTML='Failed: '+esc(e.message);return}
  const s=d.Signal,q=d.Quote,en=enabledTheories(),cat=Object.fromEntries(S.TheoryCatalog.map(x=>[x.ID,x]));
  const ths=(s.Theories||[]).slice().sort((a,b)=>(en.includes(b.ID)-en.includes(a.ID)));
  $('#mbox').innerHTML=`<button class="x" onclick="closeCo()">✕ Close</button>
  <div class="row" style="align-items:baseline"><span class="big">${esc(t)}</span><span style="font-size:18px">${esc(d.Company?.Name||s.Name)}</span><span class="pill">${esc(s.Sector)}</span>${d.Held?'<span class="pill y">IN PORTFOLIO</span>':d.Watched?'<span class="pill">TRACKING</span>':''}</div>
  <div class="row" style="margin:6px 0 12px">${q?`<span class="big" style="font-size:22px">${price(q.Price)} ${esc(q.Currency||'')}</span> ${cpct(q.DayPct,2)} <span class="mu small">5d ${pct(q.R5)} · 1mo ${pct(q.R20)} · daily vol ${q.Vol.toFixed(1)}%</span>`:'<span class="mu">No price data</span>'}<span class="grow"></span>
  ${d.Watched||d.Held?'':`<button class="pri" id="mTrk">Track 24/7</button>`}<button id="mInv">Add investment</button>${d.Watched?`<button class="dng" id="mUn">Untrack</button>`:''}</div>
  <div class="chips" id="mOv" style="margin-bottom:8px"></div>
  <div style="position:relative"><canvas id="mChart"></canvas><div id="mKey"></div><div id="mTip" style="position:absolute;display:none;background:#0b0f15f0;border:1px solid var(--ln);border-radius:8px;padding:7px 10px;font:12px/1.5 var(--mono);pointer-events:none;min-width:170px;z-index:5"></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>What Seismo thinks will happen</h3><div class="row" style="margin-bottom:8px">${ol(s.Outlook,s.OutlookLvl)} <b class="mono">${pct(s.Expected)}</b> <span class="mu small">range ${pct(s.Low)} … ${pct(s.High)} · ${s.Confidence}% confidence · ${esc(s.Horizon)}</span></div><div class="small">${esc(s.Narrative)}</div>
   <div class="kv" style="margin-top:10px"><div><span>News effect</span><b>${cpct(s.NewsMove)}</b></div><div><span>World events</span><b>${cpct(s.MacroMove)}</b></div><div><span>Trend</span><b>${cpct(s.Momentum)}</b></div><div><span>Flight risk</span><b>${fl(s.Flight,s.FlightLabel)}</b></div><div><span>Coverage</span><b>${s.NSources} src</b></div></div>
   <h3 style="margin-top:14px">Drivers</h3>${(s.Drivers||[]).map(x=>`<div class="row small" style="margin:3px 0"><span class="mono ${x.Impact>=0?'up':'dn'}" style="width:60px">${pct(x.Impact)}</span>${cls(x.Class)}<span>${esc(x.Label)}</span><span class="mu">${x.Kind}</span></div>`).join('')||'<span class="mu small">None</span>'}</div>
  <div class="card"><h3>Theories</h3>${theoryChips(s.Theories)}<div style="margin-top:10px">${ths.map(x=>`<div class="th ${en.includes(x.ID)?'':'off'}" style="padding:7px 10px"><div class="row"><span class="chip v-${x.Verdict.replace(' ','-')}">${TSHORT[x.ID]}: ${x.Verdict}</span><span class="n small">${esc(cat[x.ID]?.Name||x.ID)}</span></div><div class="small" style="margin-top:3px">${esc(x.Detail)}</div></div>`).join('')}</div><div class="mu small">Dimmed theories are turned off in the Theories tab and excluded from the consensus.</div></div></div>
  <h3 style="margin:16px 0 8px;color:var(--mu);font-size:13px;letter-spacing:.8px">EVENTS</h3>${(d.Events||[]).map(evCard).join('')||'<div class="empty">No company-specific events found in the last 7 days.</div>'}
  <div id="mPeers" style="margin-top:14px"></div>`;
  const ov=new Set(JSON.parse(localStorage.getItem('ovl')||'null')||en);
  const copt={range:localStorage.getItem('crange')||'3M',style:localStorage.getItem('cstyle')||'candles'};
  const drawOv=()=>{$('#mOv').innerHTML=`<span class="seg">${['1M','3M','6M','1Y'].map(r=>`<b data-cr="${r}" class="${copt.range===r?'on':''}">${r}</b>`).join('')}</span><span class="seg">${[['candles','Candles'],['line','Line']].map(([k,n])=>`<b data-cs="${k}" class="${copt.style===k?'on':''}">${n}</b>`).join('')}</span><span class="mu small" style="align-self:center">Show:</span>`+S.TheoryCatalog.map(x=>`<span class="chip ${ov.has(x.ID)?'v-UP':''}" data-ov="${x.ID}" style="cursor:pointer" title="${esc(OVL[x.ID]||'')}">${ov.has(x.ID)?'✓ ':''}${TSHORT[x.ID]}</span>`).join('');
    $('#mOv').querySelectorAll('[data-ov]').forEach(e=>e.onclick=()=>{ov.has(e.dataset.ov)?ov.delete(e.dataset.ov):ov.add(e.dataset.ov);localStorage.setItem('ovl',JSON.stringify([...ov]));drawOv()});
    $('#mOv').querySelectorAll('[data-cr]').forEach(e=>e.onclick=()=>{copt.range=e.dataset.cr;localStorage.setItem('crange',copt.range);drawOv()});
    $('#mOv').querySelectorAll('[data-cs]').forEach(e=>e.onclick=()=>{copt.style=e.dataset.cs;localStorage.setItem('cstyle',copt.style);drawOv()});
    renderChartKey($('#mKey'),drawChart($('#mChart'),d,s,d.Events,ov,copt))};
  drawOv();chartHover($('#mChart'),$('#mTip'));window.onresize=()=>{if($('#modal').style.display==='block'&&$('#mChart'))renderChartKey($('#mKey'),drawChart($('#mChart'),d,s,d.Events,ov,copt))};
  $('#mTrk')&&($('#mTrk').onclick=async()=>{await api('/api/track',{Ticker:t}).catch(e=>flash(e.message));flash('Tracking '+t+' 24/7');refresh();openCo(t)});
  $('#mUn')&&($('#mUn').onclick=async()=>{await api('/api/untrack',{Ticker:t});refresh();openCo(t)});
  $('#mInv').onclick=()=>{closeCo();setTab('port');setTimeout(()=>{$('#hT').value=t;$('#hI').focus()},50)};
  $('#mbox').querySelectorAll('[data-co]').forEach(e=>e.onclick=ev=>{ev.preventDefault();openCo(e.dataset.co)});
  await loadPeers(t,d.Company?.Name||s.Name,'#mPeers');
}
function closeCo(){$('#modal').style.display='none';history.replaceState(null,'',location.pathname)}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCo()};document.onkeydown=e=>{if(e.key==='Escape')closeCo()};

function wrongMenu(el){
  const ev=el.closest('.ev');ev.querySelectorAll('.wmenu').forEach(x=>x.remove());
  const t=el.dataset.t,e=el.dataset.e,k=el.dataset.k,l=el.dataset.l,ids=el.dataset.wa?[el.dataset.wa]:[];
  const scope=ids.length?'this headline':'this event';
  const m=document.createElement('div');m.className='wmenu';
  m.innerHTML=`<span class="small mu">Fix ${scope}:</span>${k!=='macro'?`<button class="sm" data-a="notco">Not about ${esc(t)}</button>`:''}<button class="sm" data-a="drop">Not really "${esc(l)}"</button>${k!=='macro'?`<select class="sm" style="padding:3px 6px;font-size:12px"><option value="">It's actually…</option>${(S.Rules||[]).filter(r=>r.ID!==e).map(r=>`<option value="${r.ID}">${r.Dir>0?'▲':'▼'} ${esc(r.Label)}</option>`).join('')}</select>`:''}<button class="sm" data-a="x">Cancel</button>`;
  (el.closest('li')||el.closest('.hd')).after(m);
  const send=async(action,relabel)=>{m.innerHTML='<span class="spin"></span>';try{await api('/api/feedback',{Ticker:t,EventID:e,Kind:k,Action:action,Relabel:relabel||'',ArticleIDs:ids});flash('Thanks, Seismo learned from that and re-scored.');await refresh();if($('#modal').style.display==='block'&&location.hash.startsWith('#t='))openCo(decodeURIComponent(location.hash.slice(3)))}catch(x){flash(x.message);m.remove()}};
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>b.dataset.a==='x'?m.remove():send(b.dataset.a));
  const sel=m.querySelector('select');sel&&(sel.onchange=()=>sel.value&&send('relabel',sel.value));
}
document.addEventListener('click',ev=>{const ext=ev.target.closest('a[href^="http"]');if(ext&&window.openExternal&&!ext.href.startsWith(location.origin)){ev.preventDefault();window.openExternal(ext.href);return}},false);
document.addEventListener('click',ev=>{const w=ev.target.closest('[data-wrong],[data-wa]');if(w){ev.preventDefault();ev.stopPropagation();wrongMenu(w)}},true);

let lastVer=null,lostCount=0;
document.addEventListener('click',async ev=>{
  const trk=ev.target.closest('[data-trk]');
  if(trk){ev.preventDefault();ev.stopPropagation();if(trk.disabled)return;trk.disabled=true;const t=trk.dataset.trk;trk.innerHTML='<span class="spin"></span>';
    try{await api('/api/track',{Ticker:t});trk.textContent='Tracking ✓';trk.classList.add('pri');flash('Now tracking '+t+' 24/7');refresh()}catch(x){trk.textContent='Track';trk.disabled=false;flash('Could not track '+t+': '+x.message)}return}
  const inv=ev.target.closest('[data-inv]');
  if(inv){ev.preventDefault();ev.stopPropagation();const t=inv.dataset.inv;closeCo();setTab('port');setTimeout(()=>{$('#hT').value=t;$('#hI').focus()},50);return}
  if(ev.target.closest('button,a,input,select'))return;
  const pick=ev.target.closest('[data-pick]');
  if(pick){loadPeers(pick.dataset.pick,pick.querySelector('span')?.textContent);openCo(pick.dataset.pick);return}
  const row=ev.target.closest('#fPeers tr[data-t],#mPeers tr[data-t],#fRes [data-t]');
  if(row){openCo(row.dataset.t)}
},true);

async function refresh(){try{S=await api('/api/state');lostCount=0;if(lastVer&&S.Version!==lastVer){location.reload();return}lastVer=S.Version;
  if(S.Nav){location.hash=S.Nav;hashRoute()}
  const top=S.Alerts?.[0];if(top&&lastAlertTop&&top.At!==lastAlertTop&&document.hidden&&'Notification'in window&&Notification.permission==='granted')new Notification(top.Title,{body:top.Body});lastAlertTop=top?.At||lastAlertTop||'x';
  render()}catch(e){lostCount++;$('#scan').textContent=lostCount>3?'Seismo has stopped. Reopen it from the Start menu or the exe.':'Reconnecting…'}}
function loop(){refresh().finally(()=>setTimeout(loop,S&&S.Scanning?3000:15000))}
$('#scanBtn').onclick=()=>{api('/api/scan',{});flash('Scan started');setTimeout(refresh,800)};
function hashRoute(){const h=location.hash;if(h.startsWith('#t='))openCo(decodeURIComponent(h.slice(3)));else if(h==='#alerts')setTab('alerts')}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#t=')&&$('#modal').style.display!=='block')hashRoute()});
loop();setTimeout(hashRoute,600);
</script>
